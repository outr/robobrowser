<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboBrowser</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#e6edf3;font:14px system-ui;display:flex;flex-direction:column;height:100vh}header,nav,section{padding:12px 20px}header{border-bottom:1px solid #34404e}h1{font-size:20px;margin:0 0 6px}p{margin:5px 0;color:#afbdcd}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,textarea,select{font:inherit;color:inherit;background:#202c3b;border:1px solid #405067;border-radius:5px;padding:8px}button{cursor:pointer}#url{flex:1;min-width:180px}main{flex:1;min-height:150px;margin:0 20px;background:white;border-radius:6px;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:white}section{display:flex;gap:16px;flex-wrap:wrap}pre{margin:0;font-size:12px;white-space:pre-wrap;max-height:120px;overflow:auto;flex:1;min-width:230px}#error{color:#ffad9d}details{padding:8px 20px}textarea{width:50%;height:45px}a{color:#8acaff}#status{color:#9fd3bc}
</style></head><body><header><h1>RoboBrowser</h1><p>Pages run natively in this browser. Keep this page open for agent access.</p></header>
<nav><input id="profile" aria-label="Profile name" placeholder="Profile (optional)" maxlength="64" style="width:160px"><input id="url" placeholder="Leave blank for the controlled fixture"><button id="open">Go</button><button id="github">GitHub</button><button id="fixture">Test fixture</button><button id="close">Close</button><span id="status">Ready</span></nav>
<nav><button id="agent-click">Agent: click fixture button</button><span id="error"></span></nav>
<main><iframe id="page" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups"></iframe></main>
<section><pre id="local">Local execution: not open</pre><pre id="remote">Agent: disconnected</pre><pre id="counts">Shared fixture writes: 0</pre></section>
<details><summary>Agent console</summary><textarea id="code">document.title</textarea><button id="eval">Run</button><pre id="result"></pre></details>
<script src="/execution.js"></script></body></html>
